<main><h1>Wisdom tooth removal</h1>
<h2>What can go wrong?</h2>
<p>Patients may experience paraesthesia after extraction.</p>
<p>The risk is 7%.</p><p>Lasting nerve damage is rare.</p>
<p>About 1 in 1,000 people have lasting damage and 3 in 100 have short-term numbness.</p>
